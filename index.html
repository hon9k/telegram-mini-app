<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090b">
  <title>Обновление загружается</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #f5f5f5;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(220, 38, 38, .15), transparent 48%),
        #09090b;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .screen {
      width: min(90vw, 560px);
      text-align: center;
      padding: 36px 20px;
    }
    .mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(248, 113, 113, .35);
      border-radius: 22px;
      background: rgba(220, 38, 38, .09);
      box-shadow: 0 0 45px rgba(220, 38, 38, .12);
    }
    .mark svg { width: 34px; height: 34px; }
    h1 {
      margin: 0;
      font-size: clamp(25px, 6vw, 38px);
      line-height: 1.15;
      font-weight: 750;
      letter-spacing: -.045em;
    }
    p {
      margin: 13px 0 30px;
      color: #a1a1aa;
      font-size: 15px;
    }
    .track {
      position: relative;
      width: 100%;
      height: 5px;
      overflow: hidden;
      border-radius: 99px;
      background: #27272a;
    }
    .runner {
      position: absolute;
      inset: 0 auto 0 -38%;
      width: 38%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, #ef4444, #fca5a5);
      animation: endless 1.35s ease-in-out infinite;
    }
    .dots { display: flex; justify-content: center; gap: 7px; margin-top: 23px; }
    .dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: #ef4444;
      animation: pulse 1s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: .15s; }
    .dots span:nth-child(3) { animation-delay: .3s; }
    .foot {
      margin-top: 30px;
      color: #52525b;
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    @keyframes endless {
      0% { left: -38%; }
      100% { left: 100%; }
    }
    @keyframes pulse {
      0%, 60%, 100% { opacity: .25; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-3px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .runner { animation-duration: 4s; }
      .dots span { animation-duration: 3s; }
    }
  </style>
</head>
<body>
  <main class="screen" role="status" aria-live="polite">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M20 7v5h-5M4 17v-5h5" stroke="#f87171" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5.6 9a7 7 0 0 1 11.7-2L20 12M4 12l2.7 5a7 7 0 0 0 11.7-2" stroke="#f87171" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Обновление загружается</h1>
    <p>Пожалуйста, подождите…</p>
    <div class="track" aria-label="Бесконечная загрузка">
      <div class="runner"></div>
    </div>
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="foot">Загрузка обновления</div>
  </main>
</body>
</html>
