<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17120f">
<title>WORLDX</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c0907;--bg:#17120f;--panel:#251d17;--panel2:#33281f;--line:#54422f;--bone:#eadfc8;--dim:#a8977e;--ember:#8b7bff;--gold:#e0b552;--blood:#c4412d;--moss:#86a65a;--ice:#7fb7cf;--hd:'Pirata One',Georgia,serif;--bd:'Alegreya Sans','Trebuchet MS',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--bone);font-family:var(--bd);font-size:16px;overflow:hidden;overscroll-behavior:none}
body::before{content:none}
button{font-family:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;position:relative}
.hud{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 9px;background:var(--panel);border-bottom:3px solid var(--ink);box-shadow:0 2px 0 var(--line)}
.emblem{width:46px;height:46px;flex:none;display:grid;place-items:center;background:var(--ember);border:3px solid var(--ink);border-radius:50% 50% 50% 8px;box-shadow:2px 2px 0 var(--ink);font:400 24px var(--hd);color:var(--ink);transform:rotate(-4deg)}
.hud-mid{flex:1;min-width:0}
.hud-name{font:400 20px/1 var(--hd);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:9px;border:2px solid var(--ink);background:#120d0a;margin-top:5px;position:relative}
.xpbar i{position:absolute;inset:0 auto 0 0;background:var(--gold);transition:width .3s}
.xptxt{font-size:11px;color:var(--dim);margin-top:2px}
.purse{display:flex;align-items:center;gap:6px;font:400 21px var(--hd);color:var(--gold);padding:4px 10px 4px 8px;border:2px solid var(--ink);background:#1a140f;box-shadow:2px 2px 0 var(--ink)}
.purse svg{width:20px;height:20px}
main{flex:1;min-width:0;min-height:0;width:100%;max-width:100%;box-sizing:border-box;overflow-y:auto;overflow-x:hidden;padding:14px 12px 104px;-webkit-overflow-scrolling:touch}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;display:flex;background:var(--panel);border-top:3px solid var(--ink);box-shadow:0 -2px 0 var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.nav button{flex:1;background:none;border:0;color:var(--dim);padding:9px 0 7px;font:700 11px var(--bd);letter-spacing:.7px;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.nav button.on{color:var(--ember);box-shadow:inset 0 4px 0 var(--ember)}
.ttl{font:400 31px/1 var(--hd);margin:2px 2px 14px;letter-spacing:.5px}
.h3{font:400 22px/1 var(--hd);margin:20px 2px 10px;color:var(--gold);letter-spacing:.4px}
.sub{color:var(--dim);font-size:14px}
.card{background:var(--panel);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink),inset 0 0 0 2px var(--line);padding:13px;margin-bottom:12px}
.btn{font:400 20px/1 var(--hd);letter-spacing:.5px;color:var(--ink);background:var(--ember);border:3px solid var(--ink);padding:10px 16px;box-shadow:3px 4px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:var(--panel2);color:var(--bone)}
.btn.gold{background:var(--gold)}
.btn.sm{font-size:17px;padding:7px 12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;pointer-events:none}
.seg{display:flex;margin-bottom:14px;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.seg button{flex:1;background:var(--panel);border:0;border-right:3px solid var(--ink);padding:9px 4px;font:400 18px var(--hd);color:var(--dim)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ember);color:var(--ink)}
.wc{display:block;width:100%;padding:0;border:3px solid var(--ink);background:var(--panel);box-shadow:4px 4px 0 var(--ink);margin-bottom:16px;text-align:left;position:relative}
.wc .bn{height:118px;overflow:hidden;border-bottom:3px solid var(--ink)}
.wc svg{display:block;width:100%;height:100%}
.wc-i{padding:10px 12px 11px;display:flex;flex-direction:column;gap:2px}
.wc-i b{font:400 24px/1 var(--hd);letter-spacing:.4px}
.wc-i span{font-size:14px;color:var(--dim)}
.wc.lock .bn{filter:grayscale(1) brightness(.45)}
.wc .lk{position:absolute;top:40px;left:50%;transform:translateX(-50%);width:44px;height:44px}
.wc .lk svg{width:100%;height:100%}
.back{background:none;border:0;color:var(--ember);font:400 20px var(--hd);padding:0 0 10px;display:flex;align-items:center;gap:6px}
.back svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:3}
.foe{display:flex;gap:12px;align-items:center;background:var(--panel);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:8px;margin-bottom:11px}
.foe.boss{box-shadow:3px 3px 0 var(--ink),inset 0 0 0 2px var(--blood)}
.pt{width:74px;height:74px;flex:none;background:#1a130e;border:2px solid var(--ink);overflow:hidden}
.pt svg{width:100%;height:100%;display:block}
.foe-i{flex:1;min-width:0}
.foe-i b{font:400 20px/1.05 var(--hd);display:block;letter-spacing:.3px}
.foe-i small{color:var(--dim);font-size:13px;display:block;margin-top:2px}
.tag{display:inline-block;font:800 10px var(--bd);letter-spacing:.8px;text-transform:uppercase;padding:2px 6px;border:2px solid var(--ink);margin-right:4px}
.tag.boss{background:var(--blood);color:var(--bone)}
.tag.ok{background:var(--moss);color:var(--ink)}
.dg-easy{color:var(--moss)}.dg-even{color:var(--gold)}.dg-hard{color:var(--blood)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;background:var(--panel);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:8px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.tile svg{width:54px;height:54px}
.tile b{font:700 13px/1.1 var(--bd)}
.tile span{font:400 16px var(--hd);color:var(--gold)}
.tile.eq{box-shadow:3px 3px 0 var(--ink),inset 0 0 0 2px var(--ember)}
.eqtag{position:absolute;top:-8px;right:-4px;background:var(--ember);color:var(--ink);border:2px solid var(--ink);font:800 9px var(--bd);padding:1px 5px;text-transform:uppercase;font-style:normal}
.row{display:flex;align-items:center;gap:12px}
.row .grow{flex:1;min-width:0}
.row b{font:400 20px/1.05 var(--hd);display:block}
.row small{color:var(--dim);font-size:13px;display:block;margin-top:2px}
.ico{width:52px;height:52px;flex:none;background:#1a130e;border:2px solid var(--ink);padding:3px}
.ico svg{width:100%;height:100%}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:10px}
.stats div{display:flex;justify-content:space-between;border-bottom:2px dotted var(--line);padding-bottom:3px;font-size:15px}
.stats div b{font:400 18px var(--hd);color:var(--gold)}
.hero-top{display:flex;gap:14px;align-items:center}
.hero-pic{width:112px;height:112px;flex:none;background:#1a130e;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.hero-pic svg{width:100%;height:100%;display:block}
.bar2{height:10px;border:2px solid var(--ink);background:#120d0a;position:relative;margin-top:5px}
.bar2 i{position:absolute;inset:0 auto 0 0;background:var(--moss)}
.bar2.g i{background:var(--gold)}
.petrow{display:flex;gap:8px}
.pet{flex:1;background:var(--panel2);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:6px 4px 8px;text-align:center}
.pet svg{width:62px;height:62px;display:block;margin:0 auto}
.pet b{font:400 17px var(--hd);display:block}
.pet.on{background:var(--ember);color:var(--ink)}
.chrow{display:flex;gap:12px;align-items:center}
.chico{width:78px;flex:none}
.chico svg{width:100%;display:block}
.odds{font-size:12.5px;color:var(--dim);line-height:1.35;margin-top:3px}
.stars{color:var(--gold);font:400 18px var(--hd)}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.st{width:calc(20% - 5px);aspect-ratio:1;display:grid;place-items:center;font:400 20px var(--hd);background:#1a130e;border:2px solid var(--ink);color:var(--dim)}
.st.done{background:var(--moss);color:var(--ink)}
.st.cur{background:var(--ember);color:var(--ink);box-shadow:0 0 0 2px var(--gold)}
.st.bs{border-color:var(--blood)}
.empty{text-align:center;color:var(--dim);padding:40px 10px;font-size:15px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);z-index:80;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:var(--bone);color:var(--ink);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font:700 14px var(--bd);padding:7px 14px;animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
.modal{position:fixed;inset:0;z-index:70;background:rgba(8,5,3,.78);display:flex;align-items:flex-end;justify-content:center;padding:14px}
.modal.mid{align-items:center}
.sheet{width:100%;max-width:440px;background:var(--panel);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink),inset 0 0 0 2px var(--line);padding:16px;animation:pop .22s ease-out;max-height:90dvh;overflow:auto}
@keyframes pop{from{transform:translateY(18px) scale(.97);opacity:0}}
.sheet h2{font:400 34px/1 var(--hd);margin:0 0 8px;letter-spacing:.5px}
.sheet h2.win{color:var(--gold)}.sheet h2.lose{color:var(--blood)}
.rw{display:flex;justify-content:space-between;padding:6px 0;border-bottom:2px dotted var(--line);font-size:16px}
.rw b{font:400 19px var(--hd);color:var(--gold)}
.lvlup{margin:10px 0;background:var(--ember);color:var(--ink);border:3px solid var(--ink);padding:8px 10px;font:400 20px var(--hd);text-align:center;transform:rotate(-1deg)}
.acts2{display:flex;gap:10px;margin-top:14px}
.acts2 .btn{flex:1;white-space:nowrap;padding-left:8px;padding-right:8px}
/* battle */
#battle{position:fixed;inset:0;z-index:60;background:var(--ink);display:flex;flex-direction:column;max-width:560px;margin:0 auto;overflow:hidden;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.bt-scene{position:absolute;inset:0}
.bt-scene svg{width:100%;height:100%;display:block}
.bt-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,9,7,.55),rgba(12,9,7,0) 28%,rgba(12,9,7,0) 55%,rgba(12,9,7,.82))}
#battle>*:not(.bt-scene):not(.bt-shade):not(.g3cv):not(.g3ui){position:relative}
.hurtfx{position:absolute!important;inset:0;pointer-events:none;box-shadow:inset 0 0 70px 14px rgba(196,65,45,.0);transition:box-shadow .25s}
#battle.hurt .hurtfx{box-shadow:inset 0 0 70px 14px rgba(196,65,45,.75);transition:none}
#battle.heavy .hurtfx{box-shadow:inset 0 0 90px 30px rgba(196,65,45,.95);transition:none}
.bt-top{display:flex;align-items:center;gap:10px}
.icon-btn{width:42px;height:42px;background:var(--panel);border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:grid;place-items:center;padding:0}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:var(--bone);stroke-width:3}
.bt-title{flex:1;min-width:0}
.bt-title b{font:400 28px/1 var(--hd);display:block;text-shadow:2px 2px 0 var(--ink);letter-spacing:.5px}
.bt-title small{font:800 12px var(--bd);letter-spacing:1px;text-transform:uppercase;color:var(--gold);text-shadow:1px 1px 0 var(--ink)}
.bar{height:26px;border:3px solid var(--ink);background:#1a1410;position:relative;overflow:hidden;box-shadow:3px 3px 0 var(--ink)}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 2px,transparent 2px 14px),var(--c);transition:width .18s}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font:700 13px var(--bd);text-shadow:1px 1px 0 var(--ink);letter-spacing:.4px}
.bar.e{--c:var(--blood)}.bar.p{--c:var(--moss)}
.ebar{margin-top:12px}
.stage{flex:1;display:grid;place-items:center;min-height:0}
.spr{width:min(76vw,290px,36dvh);aspect-ratio:1;position:relative;touch-action:manipulation}
.spr.boss{width:min(88vw,350px,42dvh)}
.spr .bob{animation:bob 2.6s ease-in-out infinite}
.spr svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.spr.hit{animation:hit .18s}
.spr.die{animation:die .7s forwards}
@keyframes bob{50%{transform:translateY(-8px) scale(1.015)}}
@keyframes hit{0%{transform:translateX(0)}25%{transform:translateX(-9px) rotate(-2deg);filter:brightness(2.2)}60%{transform:translateX(7px) rotate(1.5deg)}100%{transform:none}}
@keyframes die{to{transform:translateY(40px) rotate(8deg) scale(.8);opacity:0;filter:grayscale(1)}}
.warn{position:absolute;top:2%;left:50%;transform:translateX(-50%);background:var(--blood);color:var(--bone);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font:400 20px var(--hd);padding:6px 12px;white-space:nowrap;animation:blink .35s infinite alternate;z-index:3}
@keyframes blink{to{background:#7d1f12}}
#floats{position:absolute;inset:0;pointer-events:none;z-index:4}
.fl{position:absolute;font:400 34px var(--hd);color:#fff;text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink);animation:fup .95s ease-out forwards;white-space:nowrap}
.fl.crit{color:var(--gold);font-size:46px}
.fl.coin{color:var(--gold);font-size:24px}
.fl.item{color:var(--ice);font-size:22px}
.fl.hurt{color:#ff7a5f;font-size:30px}
.fl.heal{color:#9be06a}
.fl.shield{color:var(--ice);font-size:24px}
@keyframes fup{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-10px) scale(1.15);opacity:1}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}
.blog{min-height:42px;text-align:center;font:500 15px/1.25 var(--bd);color:var(--bone);text-shadow:1px 1px 0 var(--ink);padding:0 6px 8px}
.pbar{display:flex;align-items:center;gap:8px}
.pbar .bar{flex:1}
.shieldtag{font:400 17px var(--hd);background:var(--ice);color:var(--ink);border:3px solid var(--ink);padding:3px 8px}
.acts{display:flex;gap:10px;align-items:stretch;margin-top:12px}
.act{position:relative;overflow:hidden;width:84px;background:var(--panel);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 2px}
.act svg{width:30px;height:30px}
.act em{font:700 11px var(--bd);font-style:normal;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
.act b{font:400 16px var(--hd);color:var(--gold);position:absolute;top:1px;right:5px}
.strike{position:relative;overflow:hidden;flex:1;min-height:92px;background:var(--ember);border:3px solid var(--ink);box-shadow:4px 5px 0 var(--ink);font:400 40px var(--hd);color:var(--ink);letter-spacing:1px;touch-action:manipulation}
.strike:active{transform:translate(2px,3px);box-shadow:2px 2px 0 var(--ink)}
.cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(12,9,7,.62);pointer-events:none}
.chest-wrap{text-align:center;padding:10px 0}
.chest-wrap .chest>svg{width:170px;overflow:visible;display:block;margin:0 auto}
.chest-wrap{overflow:hidden}
.chest.shake{animation:cshake .9s}
@keyframes cshake{10%,50%,90%{transform:rotate(-5deg)}30%,70%{transform:rotate(5deg)}}
.chest .lid{transform-box:fill-box;transform-origin:left bottom;transition:transform .35s}
.chest.open .lid{transform:rotate(-24deg) translate(-2px,-3px)}
.reveal{animation:pop .35s ease-out}
.reveal .ico{width:84px;height:84px;margin:8px auto;padding:6px}
.reveal .ico svg{width:100%;height:100%;display:block}
.reveal h3{font:400 28px var(--hd);margin:4px 0}

.bar.s{--c:var(--ice);height:17px;margin-top:6px}.bar.s span{font-size:11px}
.ultbar{height:15px;border:3px solid var(--ink);background:#1a1410;margin-top:6px;position:relative;overflow:hidden;box-shadow:2px 2px 0 var(--ink)}
.ultbar i{position:absolute;inset:0 auto 0 0;width:0;background:#6a5cff;transition:width .2s}
.ultbar span{position:absolute;inset:0;display:grid;place-items:center;font:700 10px var(--bd);letter-spacing:.8px;text-transform:uppercase;text-shadow:1px 1px 0 var(--ink)}
.ultbar.warn{animation:blink .3s infinite alternate}.ultbar.warn i{background:var(--blood)}
.chips{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;min-height:26px}
.chip{font:400 15px var(--hd);background:var(--panel);border:2px solid var(--ink);padding:1px 8px;box-shadow:2px 2px 0 var(--ink);text-shadow:1px 1px 0 var(--ink)}
.chip.r1{color:#f2d34a}.chip.r2{color:#f0a030}.chip.r3{color:#ff6a3a}.chip.r4{color:#ff3a2a;animation:blink .4s infinite alternate}
.mns{position:absolute;left:0;right:0;bottom:2px;display:flex;justify-content:center;gap:8px;z-index:5}
.mn{width:74px;background:rgba(12,9,7,.78);border:3px solid var(--ink);padding:2px 2px 3px;box-shadow:2px 2px 0 var(--ink);animation:pop .25s ease-out}
.mn .mp svg{width:100%;display:block}
.mb{height:7px;background:#120d0a;border:2px solid var(--ink);margin-top:2px;position:relative}
.mb i{position:absolute;inset:0 auto 0 0;background:var(--blood)}
.spr.rage .bob{animation-duration:1.4s}
.inp{width:100%;padding:11px 12px;font:700 18px var(--bd);background:#1a130e;color:var(--bone);border:3px solid var(--ink);outline:none;margin:6px 0 10px;-webkit-user-select:text;user-select:text}
.adg{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.adg .adl{flex:1;font:400 19px var(--hd)}
.adg .btn{min-width:46px}
.adg select{flex:1;min-width:0;padding:9px 6px;font:700 14px var(--bd);background:#1a130e;color:var(--bone);border:3px solid var(--ink)}

.roll{position:relative;overflow:hidden;border:3px solid var(--ink);background:#120d0a;height:140px;box-shadow:inset 0 0 0 2px var(--line);margin:8px 0}
.roll::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(90deg,#120d0a 0,transparent 16%,transparent 84%,#120d0a 100%)}
.roll::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:4px;margin-left:-2px;background:var(--gold);z-index:4;box-shadow:0 0 12px 2px rgba(139,123,255,.7)}
.strip{display:flex;gap:6px;padding:10px 0;will-change:transform}
.rc{flex:none;width:96px;height:118px;background:var(--panel2);border:3px solid var(--ink);border-bottom:7px solid var(--rc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px;box-shadow:inset 0 -26px 22px -18px var(--rc)}
.rc svg{width:58px;height:58px}
.rc b{font:700 11px/1.1 var(--bd);text-align:center}
.rc.win{animation:wglow .7s ease-in-out infinite alternate;position:relative;z-index:2}
@keyframes wglow{from{box-shadow:inset 0 -26px 22px -18px var(--rc),0 0 6px 0 var(--rc)}to{box-shadow:inset 0 -26px 22px -18px var(--rc),0 0 22px 6px var(--rc)}}

.ragefx{position:absolute!important;inset:0;pointer-events:none;box-shadow:inset 0 0 130px 36px rgba(255,40,20,var(--rg,0));animation:rpulse 1.1s ease-in-out infinite alternate}
@keyframes rpulse{to{opacity:.55}}
.evt{position:absolute!important;left:0;right:0;top:36%;text-align:center;pointer-events:none;z-index:8;font:400 44px/1 var(--hd);letter-spacing:1px;color:#ffd23a;opacity:0;text-shadow:-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink),3px 3px 0 var(--ink),0 0 24px rgba(255,80,20,.9)}
.evt.rg{color:#ff5a3a}
.evt.sm{color:#a99bff}
.evt.go{animation:evgo 1.7s ease-out forwards}
@keyframes evgo{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.25)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05) translateY(-14px)}}

function estats(e){
  const h=hero(),w=S.equip.weapon?ITEMS[S.equip.weapon].b:0;
  const noW=(55+(S.level-1)*12+S.stats.str*8)*h.mul;           // удар героя без оружия
  const ratio=w*h.mul/Math.max(1,noW);                          // насколько оружие усиливает героя
  const avg=((h.min+h.max)/2)*(1+h.crit/100);                   // средний реальный удар
  const dps=avg*1.54,dpsNoW=noW*(1+h.crit/100)*1.54;
  const T=e.boss?26:11;
  const tF=Math.max(.75,Math.min(1.3,1-.03*(S.level-e.rl)));   // перекачка чуть ускоряет бой, но не обнуляет его
  const hp=Math.round(T*tF*(dpsNoW+.9*(dps-dpsNoW))/10)*10;     // враг подстраивается под оружие
  const hpMax=Math.max(100+(e.rl-1)*20,.9*h.maxHp);
  const dmg=(e.boss?.44:.34)*hpMax/T*(1+Math.min(1,.35*ratio));
  return{hp,dmg,adapt:hp/Math.max(1,Math.round(T*tF*dpsNoW/10)*10)};
}

async function buyChest(i){
  const c=CHESTS[i];

let _ac;
function tickSnd(){if(SFX.on())SFX.p('tick');return;try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();const o=_ac.createOscillator(),g=_ac.createGain();o.type='square';o.frequency.value=520;g.gain.value=.03;o.connect(g);g.connect(_ac.destination);o.start();o.stop(_ac.currentTime+.025);}catch(e){}}
async function openChest(i){
  const c=CHESTS[i],name=wpick(c.d);addItem(name);S.chests++;save();
  const N=62,WIN=53,STEP=102,cards=[];
  for(let k=0;k<N;k++)cards.push(k===WIN?name:wpick(c.d));
  const card=n=>{const it=ITEMS[n];return `<div class="rc" style="--rc:${COL[it.r]}">${itemIcon(n)}<b>${n}</b></div>`;};
  modal(`<h2 style="font-size:28px;margin-bottom:2px">${c.n}</h2><div class="roll" id="roll"><div class="strip" id="strip">${cards.map(card).join('')}</div></div><div id="chr" style="text-align:center;min-height:128px;padding-top:6px"><button class="btn alt sm" id="skip">Пропустить</button></div>`,{mid:1,lock:1});
  const roll=$('#roll'),strip=$('#strip');
  const target=-(WIN*STEP+48+(Math.random()-.5)*64)+roll.clientWidth/2;
  let done=false,last=-1,iv;
  const finishRoll=()=>{
    if(done)return;done=true;clearInterval(iv);
    strip.style.transition='none';strip.style.transform=`translateX(${target}px)`;
    strip.children[WIN].classList.add('win');
    const it=ITEMS[name],more=S.cases[i]>0;
    const showRes=()=>{$('#chr').innerHTML=`<div class="reveal"><h3 style="color:${COL[it.r]};margin:6px 0 0">${name}</h3><div class="sub">${RN[it.r]}${it.t==='weapon'?' · +'+it.b+' к удару':it.t==='armor'?' · −'+armorPct(it.b)+'% урона':''}</div><div class="acts2"><button class="btn" data-act="close">Забрать</button>${more?`<button class="btn alt" data-act="chest" data-i="${i}">Ещё ×${S.cases[i]}</button>`:''}</div></div>`;
    buzz(it.r==='epic'||it.r==='divine'?'heavy':'medium');render();};
    if(window.WX_chestFX)WX_chestFX(name,it.r,showRes);else showRes();
  };
  $('#skip').onclick=finishRoll;
  strip.style.transform='translateX(0)';
  await sleep(60);
  strip.style.transition='transform 6.4s cubic-bezier(.06,.62,.1,1)';
  strip.style.transform=`translateX(${target}px)`;
  iv=setInterval(()=>{
    const x=new DOMMatrix(getComputedStyle(strip).transform).m41,idx=Math.floor((roll.clientWidth/2-x)/STEP);
    if(idx!==last){last=idx;buzz('light');tickSnd();}
  },40);
  strip.addEventListener('transitionend',()=>setTimeout(finishRoll,250),{once:true});
  setTimeout(finishRoll,7200);
}

  if(Math.random()<.25){const c=Math.max(1,Math.round(rand(B.e.coins[0],B.e.coins[1])*.05));S.coins+=c;B.coins+=c;qAdd('coin',c);float('+'+c,'coin',false);msg+=` +${c} монет.`;}
  if(Math.random()<.008){const n=wpick(HIT_DROPS);addItem(n);B.drops.push(n);float(n,'item',false);msg+=` Выпало: ${n}!`;}
  say(msg);

function hsh(s){let a=0x811c9dc5,b=5381;for(const ch of s){const c=ch.charCodeAt(0);a^=c;a=Math.imul(a,16777619)>>>0;b=((b<<5)+b+c)>>>0;}return a.toString(36)+'-'+b.toString(36);}

function adminAct(k){
  const n=Math.max(0,Math.floor(+(($('#adn')||{}).value)||0));

const nm=()=>{try{return String(NAME||'Гонщик').slice(0,14)}catch(e){return 'Гонщик'}};
const ice=()=>({config:{iceServers:(window.WXNET&&WXNET.ice)||[{urls:'stun:stun.l.google.com:19302'}]}});
function tt(m){try{toast(m)}catch(e){N.msg=m;draw()}}
function draw(){if(!N.ov)return;const o=N.ov,pl=N.pl.map((p,i)=>'<div style="padding:6px 0;border-bottom:1px dotted #54422f">'+(i?'🏎':'👑')+' '+esc(p.n)+'</div>').join('');
 const st='background:#e0b552;color:#0c0907;border:3px solid #0c0907;font:400 20px Pirata One,serif;padding:10px;width:100%;margin-top:10px';
 let h='<div style="max-width:420px;margin:0 auto;padding:18px"><h2 style="font:400 28px Pirata One,serif;color:#e0b552;margin:0 0 10px">🌐 Онлайн-гонка</h2>';
 if(!N.role)h+='<button data-a="mk" style="'+st+'">Создать комнату</button><input id="f1c" maxlength="5" placeholder="КОД" style="width:100%;margin-top:14px;padding:11px;text-align:center;font:700 24px Pirata One,serif;letter-spacing:6px;background:#120d0a;color:#eadfc8;border:2px solid #54422f;text-transform:uppercase;-webkit-user-select:text;user-select:text"><button data-a="jn" style="'+st+'">Войти по коду</button>';
 else{h+='<div style="text-align:center;font:700 34px Pirata One,serif;letter-spacing:8px;color:#e0b552;-webkit-user-select:text;user-select:text">'+N.code+'</div><div style="text-align:center;color:#a8977e;font-size:13px">отправь код друзьям · игроков: '+N.pl.length+'/'+MAX+'</div><div style="margin:10px 0">'+pl+'</div>';
  if(N.role==='host')h+='<div style="color:#a8977e;font-size:13px">Трасса:</div><div style="display:flex;flex-wrap:wrap;gap:6px">'+TN.map((t,i)=>'<button data-a="tr" data-i="'+i+'" style="flex:1 1 45%;padding:8px;border:2px solid #0c0907;background:'+(N.trk===i?'#e0b552;color:#0c0907':'#33281f;color:#eadfc8')+'">'+t+'</button>').join('')+'</div><button data-a="go" style="'+st+'">Старт ('+N.pl.length+')</button>';
  else h+='<div style="text-align:center;color:#a8977e">Трасса: '+TN[N.trk]+' · ждём старта хоста…</div>';}
 if(N.msg)h+='<div style="color:#c4412d;margin-top:8px;text-align:center">'+esc(N.msg)+'</div>';
 h+='<button data-a="x" style="'+st.replace('#e0b552','#33281f').replace('#0c0907;border','#eadfc8;border')+'">Закрыть</button></div>';o.innerHTML=h;}
function ui(){if(N.ov)return;const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(12,9,7,.96);color:#eadfc8;overflow:auto;font-family:Alegreya Sans,sans-serif;padding-top:env(safe-area-inset-top,0px)';
 o.onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;if(a==='mk')host();else if(a==='jn')join((document.getElementById('f1c').value||'').toUpperCase().trim());
  else if(a==='tr'){N.trk=+b.dataset.i;bc({t:'lobby',pl:N.pl.map(p=>({n:p.n})),trk:N.trk,code:N.code});draw();}else if(a==='go')start();else if(a==='x'){leave();}};
 document.body.appendChild(o);N.ov=o;draw();}
function close(){if(N.ov){N.ov.remove();N.ov=null;}}
const bc=(m,ex)=>{for(const id in N.conns)if(id!==ex)try{N.conns[id].send(m)}catch(e){}};
function deliver(d){try{window.__f1in(d)}catch(e){}}
function host(){if(!window.Peer)return tt('Сеть недоступна (PeerJS)');N.msg='';N.code=gen();N.role='host';N.idx=0;N.pl=[{n:nm(),id:'host'}];N.started=0;N.rdy={};
 const p=N.peer=new Peer('wxf1-'+N.code,ice());p.on('error',e=>{if(e&&e.type==='unavailable-id'){leave(1);host();}else{N.msg='Ошибка сети: '+(e&&e.type||'');draw();}});
 p.on('connection',c=>{c.on('open',()=>{c.on('data',m=>onH(c,m));});c.on('close',()=>drop(c.peer));c.on('error',()=>drop(c.peer));});draw();}
function onH(c,m){if(!m||!m.t)return;const id=c.peer;
 if(m.t==='join'){if(N.started)return c.send({t:'deny',r:'Гонка уже идёт'});if(N.pl.length>=MAX)return c.send({t:'deny',r:'Комната полна'});
  N.conns[id]=c;N.pl.push({n:String(m.n||'Гонщик').slice(0,14),id});lobby();}
 else if(m.t==='rdy'){N.rdy[id]=1;chk();}
 else{const i=N.pl.findIndex(p=>p.id===id);if(i<0)return;const o={t:'rl',f:i,d:m};bc(o,id);deliver(Object.assign({f:i},m));}}
function lobby(){const l={t:'lobby',pl:N.pl.map(p=>({n:p.n})),trk:N.trk,code:N.code};bc(l);draw();}
function drop(id){const i=N.pl.findIndex(p=>p.id===id);if(i<0)return;N.pl.splice(i,1);delete N.conns[id];
 if(N.started){bc({t:'gone',f:i});deliver({t:'gone',f:i});}else lobby();}
function join(code){if(!window.Peer)return tt('Сеть недоступна (PeerJS)');if(code.length<4){N.msg='Введи код';return draw();}N.msg='Подключаемся…';draw();
 const p=N.peer=new Peer(undefined,ice());p.on('error',e=>{N.msg=e&&e.type==='peer-unavailable'?'Комната не найдена':'Ошибка сети';N.role=null;draw();});
 p.on('open',()=>{const c=p.connect('wxf1-'+code,{reliable:true});N.conn=c;let ok=0;setTimeout(()=>{if(!ok){N.msg='Не удалось подключиться';draw();}},9000);
  c.on('open',()=>{ok=1;N.role='guest';N.code=code;N.msg='';c.send({t:'join',n:nm()});draw();});c.on('data',onG);
  c.on('close',()=>{if(N.role){if(N.started)deliver({t:'gone',all:1});N.msg='Хост вышел';N.role=null;N.started=0;draw();}});});}
function onG(m){if(!m||!m.t)return;
 if(m.t==='lobby'){N.pl=m.pl;N.trk=m.trk;N.code=m.code||N.code;draw();}
 else if(m.t==='deny'){N.msg=m.r;N.role=null;draw();}
 else if(m.t==='start')begin(m);
 else if(m.t==='rl')deliver(Object.assign({f:m.f},m.d));
 else if(m.t==='go')deliver({t:'go'});
 else if(m.t==='gone')deliver(m);}
function start(){if(N.pl.length<1)return;N.started=1;N.rdy={};const pl=N.pl.map((p,i)=>({n:p.n,slot:SL[i]}));
 N.pl.forEach((p,i)=>{if(i)N.conns[p.id].send({t:'start',trk:N.trk,pl,idx:i});});begin({trk:N.trk,pl,idx:0});
 setTimeout(go,90000);}
function begin(m){N.started=1;window.__f1onl={idx:m.idx,slot:m.pl[m.idx].slot,pl:m.pl,go:0};close();window.__f1.open(m.trk);}
function chk(){if(N.pl.every((p,i)=>i===0||N.rdy[p.id])&&N.rdy.host)go();}
function go(){if(N.went)return;N.went=1;bc({t:'go'});deliver({t:'go'});setTimeout(()=>{N.went=0},5000);}
function out(d){if(!N.role||!d)return;if(N.role==='host'){if(d.t==='rdy'){N.rdy.host=1;chk();}else bc({t:'rl',f:0,d});}else if(N.conn)try{N.conn.send(d)}catch(e){}}
function leave(keep){try{if(N.peer)N.peer.destroy();}catch(e){}N.peer=null;N.conn=null;N.conns={};N.role=null;N.pl=[];N.started=0;N.went=0;N.rdy={};if(!keep){close();}}
window.__f1net={ui,out,leave};
})();
</script>
</body></html>
